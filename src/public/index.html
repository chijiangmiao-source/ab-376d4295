<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞控令牌移交复核</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a212b; --line: #2c3743;
    --fg: #d7e0ea; --muted: #8a99a8; --accent: #4da3ff;
    --ok: #3fbf7f; --bad: #ff6b6b; --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
  textarea {
    width: 100%; min-height: 320px; resize: vertical; background: #0b0f14; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 12.5px/1.6 ui-monospace, Menlo, Consolas, monospace;
  }
  input[type=text] {
    background: #0b0f14; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font: 12.5px ui-monospace, Menlo, Consolas, monospace; width: 240px;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #08121f; border: 0; border-radius: 6px; padding: 9px 18px;
    font-weight: 700; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: wait; }
  .verdict { font-size: 16px; font-weight: 700; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .verdict.accept { background: rgba(63,191,127,.12); color: var(--ok); border: 1px solid rgba(63,191,127,.4); }
  .verdict.reject { background: rgba(255,107,107,.12); color: var(--bad); border: 1px solid rgba(255,107,107,.4); }
  .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  th, td { text-align: left; border-top: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; border: 1px solid var(--line); color: var(--muted); }
  .pathbox { background: #0b0f14; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: 12.5px; }
  .kvs { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 12.5px; margin: 8px 0; }
  .kvs .k { color: var(--muted); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); }
  .errtitle { color: var(--bad); font-weight: 700; margin: 6px 0; }
  .ok-title { color: var(--ok); }
  .banner { font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-top: 8px; display: none; }
  .banner.show { display: block; }
  .banner.reused { background: rgba(77,163,255,.12); color: var(--accent); border: 1px solid rgba(77,163,255,.4); }
  .banner.conflict { background: rgba(255,107,107,.12); color: var(--bad); border: 1px solid rgba(255,107,107,.4); }
  .samples button { font-weight: 500; background: transparent; border: 1px solid var(--line); color: var(--fg); padding: 5px 10px; margin: 0 6px 6px 0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>飞控令牌移交复核台</h1>
  <span class="sub">受限脚本：令牌声明 · consume · let · 匿名函数 · 调用 · if</span>
</header>
<main>
  <section class="card">
    <h2>提交脚本</h2>
    <textarea id="script" spellcheck="false"></textarea>
    <div class="row">
      <label class="muted">审计标识（可留空，按输入摘要派生）</label>
      <input type="text" id="auditId" placeholder="AUD-…">
    </div>
    <div class="row">
      <button id="submit">提交复核</button>
      <button class="ghost" id="readback">按标识读回</button>
      <span class="muted" id="hash"></span>
    </div>
    <div id="banner" class="banner"></div>
    <div class="samples" style="margin-top:14px">
      <h2 style="margin-bottom:6px">样例</h2>
      <button data-s="legal">合法移交</button>
      <button data-s="closure">闭包捕获后外层再消费</button>
      <button data-s="imbalance">分支消费不平衡</button>
      <button data-s="polymorphism">let 多态</button>
      <button data-s="unreachable">一支不可达</button>
    </div>
  </section>

  <section class="card">
    <h2>复核结论</h2>
    <div id="result"><span class="muted">尚未提交。</span></div>
  </section>
</main>

<script>
const SAMPLES = {
  legal:
`token cmd;
let f = function (x) {
  consume x;
};
f(cmd);`,
  closure:
`token key;
let g = function () {
  consume key;
};
g();
consume key;`,
  imbalance:
`token a;
token flag;
let r = if (flag) {
  consume a;
} else {
};
consume r;`,
  polymorphism:
`token takeoff;
token land;
let relay = function (t) {
  consume t;
};
relay(takeoff);
relay(land);`,
  unreachable:
`token flag;
token cmd;
consume flag;
let r = if (flag) {
  consume cmd;
} else {
  consume cmd;
};`,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const loc = (l) => l ? `第 ${l.line} 行第 ${l.column} 列` : '—';

document.querySelectorAll('.samples button').forEach((b) => {
  b.addEventListener('click', () => { $('script').value = SAMPLES[b.dataset.s]; });
});

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text.replace(/\r\n/g, '\n')));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

$('script').addEventListener('input', async () => {
  const v = $('script').value;
  $('hash').textContent = v.trim() ? '输入摘要 sha256:' + (await sha256Hex(v)).slice(0, 16) + '…' : '';
});

function renderConsumption(c) {
  let where;
  if (c.locationsByPath) {
    const p = c.locationsByPath;
    const viaLine = (v) => v && v.length ? `<div class="muted">${esc(v.map(x => `闭包 ${loc(x.functionSite)} → 调用 ${loc(x.callSite)}`).join('；'))}</div>` : '';
    where = `<div>then：${loc(p.then.location)}</div>${viaLine(p.then.via)}<div>else：${loc(p.else.location)}</div>${viaLine(p.else.via)}`;
  } else {
    where = esc(c.locationText || loc(c.location));
    if (c.via && c.via.length) where += `<div class="muted">${esc(c.via.map(v => `闭包 ${loc(v.functionSite)} → 调用 ${loc(v.callSite)}`).join('；'))}</div>`;
    if (c.consumedInBranch) where += '<div class="muted">（令牌在分支内声明，两支分别消费）</div>';
  }
  return `<tr><td class="mono">${esc(c.tokenType)}</td><td>${esc(c.origin || '')}</td><td>${where}</td></tr>`;
}

function renderAccept(data) {
  const c = data.conclusion;
  const calls = (c.calls || []).map(call => `
    <details><summary>调用 ${esc(call.callee)} @ ${loc(call.callSite)}</summary>
      <div class="kvs">
        <div class="k">函数位置</div><div>${loc(call.functionSite)}</div>
        <div class="k">实参</div><div>${call.arguments.map(a => `${esc(a.name)}: <code>${esc(a.tokenType)}</code>`).join('，') || '无'}</div>
        <div class="k">形参实例化</div><div>${call.parameters.map(p => `${esc(p.name)}: <code>${esc(p.instantiatedType)}</code>`).join('，') || '无'}</div>
        <div class="k">返回剩余集合</div><div>${(call.returnedRemaining||[]).map(t => `<code>${esc(t.type)}</code>×${t.count}`).join('，') || '{ }（空）'}</div>
      </div>
    </details>`).join('');
  const branches = (c.branches || []).map(b => `
    <details><summary>if @ ${loc(b.at)}（裁决路径：${b.adjudicatedPaths.join(' / ')}）</summary>
      <div class="kvs">
        <div class="k">可达性</div><div>then=${b.reachable.then ? '可达' : '不可达'}，else=${b.reachable.else ? '可达' : '不可达'}</div>
        <div class="k">消费数量</div><div>then=${b.consumedCounts.then ?? '—'}，else=${b.consumedCounts.else ?? '—'}</div>
        <div class="k">then 剩余</div><div>${(b.remaining.then||[]).map(t => `<code>${esc(t.type)}</code>×${t.count}`).join('，') || '{ }（空）'}</div>
        <div class="k">else 剩余</div><div>${(b.remaining.else||[]).map(t => `<code>${esc(t.type)}</code>×${t.count}`).join('，') || '{ }（空）'}</div>
      </div>
    </details>`).join('');
  return `
    <div class="verdict accept">✔ 接受（accept）— ${esc(c.message || '')}</div>
    <h2 class="ok-title">规范类型</h2>
    <div>${(c.normalizedTypes||[]).map(t => `<span class="tag mono">${esc(t)}</span> `).join('')}</div>
    <h2 class="ok-title" style="margin-top:14px">每个令牌唯一的消费位置</h2>
    <table><thead><tr><th>规范类型</th><th>来源</th><th>消费位置</th></tr></thead>
      <tbody>${(c.consumptionMap||[]).map(renderConsumption).join('')}</tbody></table>
    ${calls ? `<h2 class="ok-title" style="margin-top:14px">调用统一（实参 / 返回值）</h2>${calls}` : ''}
    ${branches ? `<h2 class="ok-title" style="margin-top:14px">分支剩余令牌集合合一</h2>${branches}` : ''}`;
}

function renderReject(c) {
  const d = c.detail || {};
  let extra = '';
  if (c.reasonCode === 'DOUBLE_CONSUME') {
    extra = `
      <div class="kvs">
        <div class="k">变量</div><div class="mono">${esc(d.variable)}</div>
        <div class="k">规范类型</div><div class="mono">${esc(d.tokenType)}</div>
        <div class="k">变量跨度</div><div>${esc(d.spanText)}</div>
      </div>
      <div class="muted">冲突路径（页面与接口一致）：</div>
      <div class="pathbox">${(d.conflictPath||[]).map(esc).join('\n')}</div>`;
  } else if (c.reasonCode === 'BRANCH_MISMATCH') {
    const fmt = (arr) => (arr||[]).length ? arr.map(t => `${t.type}×${t.count}`).join('，') : '{ }（空）';
    extra = `
      <div class="kvs">
        <div class="k">位置</div><div>${loc(d.at)}</div>
        <div class="k">消费数量</div><div>then=${d.consumedCounts?.then}，else=${d.consumedCounts?.else}</div>
        <div class="k">then 结束剩余</div><div class="mono">${esc(fmt(d.remaining?.then))}</div>
        <div class="k">else 结束剩余</div><div class="mono">${esc(fmt(d.remaining?.else))}</div>
      </div>
      <div class="pathbox">${esc(d.remainingText ? `then ${d.remainingText.then}\nelse ${d.remainingText.else}` : '')}</div>`;
  } else if (d.at) {
    extra = `<div class="kvs"><div class="k">位置</div><div>${loc(d.at)}</div></div>`;
  }
  return `
    <div class="verdict reject">✘ 拒绝（reject）</div>
    <div class="errtitle">${esc(c.reasonCode)}</div>
    <div>${esc(c.reason)}</div>${extra}`;
}

function render(data) {
  const banner = $('banner');
  banner.className = 'banner show ' + (data.reused ? 'reused' : '');
  banner.textContent = data.reused
    ? `相同内容重传：返回原结论（审计标识 ${data.auditId}，未改写）。`
    : `已固定保存：审计标识 ${data.auditId}，输入摘要 ${data.inputSummary.slice(0,24)}…`;
  $('result').innerHTML = data.conclusion.verdict === 'accept' ? renderAccept(data) : renderReject(data.conclusion);
}

async function submit() {
  const btn = $('submit'); btn.disabled = true;
  try {
    const payload = { script: $('script').value };
    const id = $('auditId').value.trim();
    if (id) payload.auditId = id;
    const resp = await fetch('/api/reviews', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (resp.status === 409) {
      const banner = $('banner');
      banner.className = 'banner show conflict';
      banner.textContent = `拒绝复用标识 ${data.auditId}：该标识已绑定不同输入，旧结论保持不变。`;
      $('auditId').value = '';
      $('result').innerHTML = renderReject(data.existingConclusion) +
        `<div class="errtitle" style="margin-top:12px">本次拒绝原因：AUDIT_ID_REUSED</div><div>${esc(data.message)}</div>`;
      return;
    }
    if (!resp.ok) { $('result').innerHTML = `<div class="errtitle">${esc(data.error)}</div><div>${esc(data.message||'')}</div>`; return; }
    render(data);
  } catch (e) {
    $('result').innerHTML = `<div class="errtitle">请求失败</div><div>${esc(e.message)}</div>`;
  } finally { btn.disabled = false; }
}

async function readback() {
  const id = $('auditId').value.trim();
  if (!id) { alert('请填写要读回的审计标识'); return; }
  const resp = await fetch('/api/reviews/' + encodeURIComponent(id));
  if (resp.status === 404) { $('result').innerHTML = '<div class="errtitle">未找到该审计标识对应的结论</div>'; return; }
  const rec = await resp.json();
  $('script').value = '';
  const banner = $('banner');
  banner.className = 'banner show reused';
  banner.textContent = `重开读回：审计标识 ${rec.auditId}，保存于 ${rec.submittedAt}`;
  $('result').innerHTML = rec.conclusion.verdict === 'accept'
    ? renderAccept({ ...rec, reused: true }) : renderReject(rec.conclusion);
}

$('submit').addEventListener('click', submit);
$('readback').addEventListener('click', readback);
</script>
</body>
</html>
